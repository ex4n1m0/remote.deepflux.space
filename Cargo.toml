[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/session",
    "crates/diagnostics",
    "crates/frame-surface",
    "crates/capture-windows",
    "crates/codec-windows",
    "crates/transport-webrtc",
    "crates/input-windows",
    "crates/render-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# Every crate in this workspace:
#   [package] version/edition/rust-version from workspace.package,
#   lints.workspace = true,
#   dependencies only via `workspace = true`.
