[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/session",
    "crates/diagnostics",
    "crates/frame-surface",
    "crates/capture-windows",
    "crates/codec-windows",
    "crates/transport-webrtc",
    "crates/input-windows",
    "crates/render-windows",
    "crates/node-runtime",
    # M4 product shell (RD-011/RD-012). Its dependency pins (tauri tree)
    # live in apps/desktop/src-tauri/Cargo.toml; the integrator
    # consolidates them into [workspace.dependencies] later.
    "apps/desktop/src-tauri",
    # ModelSwarm crates imported at the pinned MSP v0.2.42 (ADR-013, D1;
    # source: MSP repo commit 16995d3). They keep their own edition 2021 /
    # version 0.2.42 and their inline MSP lint tables (unsafe_code forbid,
    # clippy all deny) instead of inheriting this workspace's tables, so
    # Remote's existing lint posture is unchanged. Fixture tree
    # protocol/vectors/ is copied alongside (referenced by tests and
    # compile-time include_str!).
    "crates/modelswarm-types",
    "crates/modelswarm-identity",
    "crates/modelswarm-transport",
    "crates/modelswarm-eligibility",
    "crates/modelswarm-runtime",
    "crates/modelswarm-scheduler",
    "crates/modelswarm-session",
    "crates/modelswarm-speculation",
    "crates/modelswarm-store",
    "crates/modelswarm-gateway",
    "crates/modelswarm-telemetry",
    "crates/modelswarm-winjob",
    "crates/modelswarm-resource",
    # OnlyHumans protocol ported at the pinned v1.2.0 (ADR-013, D4; source:
    # OnlyHumans-app repo tag v1.2.0, commit 427ec0a — the standalone product
    # is untouched). Verbatim mechanical pin, MSP-import style: keeps its own
    # edition 2024 / version 1.2.0. Two deliberate deviations from the source
    # tree: (1) src/gk_channel.bin re-minted — DeepMulti's own room universe,
    # no shared channel/secrets with the standalone product (D4); (2) the
    # crate-local Cargo.lock dropped — the workspace lock governs. (3) the
    # tree rustfmt-normalized under the workspace toolchain (rustfmt 1.11.0,
    # mechanical whitespace/wrap changes only — the source's fmt predates it).
    # (4) rusqlite aligned 0.40.2 -> 0.32 to share the single libsqlite3-sys
    # generation modelswarm-store pins (Cargo forbids two `links = "sqlite3"`
    # copies); store.rs's surface is pre-0.32-stable API only.
    # build.rs writes its per-clone secret to crates/secrets/ (gitignored).
    "crates/onlyhumans-core",
]

[workspace.package]
version = "0.15.3"
edition = "2024"
# 1.88, not 1.85: the transport dep tree (rtc 0.21) uses let-chains, raising
# the effective MSRV above edition-2024's floor. Toolchain is 1.98.1.
rust-version = "1.88"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
windows = "=0.62.2"
# Transport stack (ADR-002): exact pins; upgrades are deliberate patches with
# the M2 rig re-run. `rtc` is a direct dep because RTP/H264/Marshal types are
# not re-exported by `webrtc`.
webrtc = "=0.21.0"
rtc = "=0.21.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync", "io-std"] }
bytes = "=1.12.1"
async-trait = "=0.1.92"
openh264 = "=0.9.8"
# Agent frame tap (ADR-004, RD-016): JPEG encoding of readback screenshots
# in `node-runtime::screenshot`. Pure Rust, no build tooling.
image = { version = "=0.25.6", default-features = false, features = ["jpeg"] }
# MCP image content (ADR-004, RD-018): base64 of screenshot JPEGs.
base64 = "=0.22.1"
# M3 remote signaling client (`node-runtime::signaling_remote`): WebSocket
# primary + HTTP polling fallback against the Vercel service. native-tls =
# schannel on Windows (no extra build tooling), matching the workspace's
# exact-pin policy for the transport-adjacent tree.
tungstenite = { version = "=0.26.2", features = ["native-tls"] }
native-tls = "=0.2.14"
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls", "gzip", "json"] }
# Device-token entropy for the signaling client (safe API; keeps the
# node-runtime free of new `unsafe` beyond the AGENTS.md sanctioned list).
getrandom = "=0.3.3"
# AES-256-GCM envelope crypto (chat sealing; RustCrypto leaf crate,
# pure-safe, no extra build tooling).
aes-gcm = "0.10"
hex = "0.4"
# ADR-006: pairing-proof HMAC (node-runtime::pairing_proof) and the
# circle-id SHA-256 derivation (node-runtime::directory). RustCrypto leaf
# crates, pure-safe.
sha2 = "0.10"
hmac = "0.12"

# M6 F59 fork pins (see ADR-002 "M6 fork" section): local, patched copies of
# the exact upstream versions. `[patch.crates-io]` applies workspace-wide.
[patch.crates-io]
rtc = { path = "fork/rtc" }

# Every crate in this workspace:
#   [package] version/edition/rust-version from workspace.package,
#   lints.workspace = true,
#   dependencies only via `workspace = true`.
