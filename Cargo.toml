[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/session",
    "crates/diagnostics",
    "crates/frame-surface",
    "crates/capture-windows",
    "crates/codec-windows",
    "crates/transport-webrtc",
    "crates/input-windows",
    "crates/render-windows",
    "crates/node-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, not 1.85: the transport dep tree (rtc 0.21) uses let-chains, raising
# the effective MSRV above edition-2024's floor. Toolchain is 1.98.1.
rust-version = "1.88"

[workspace.lints.rust]
rust_2018_idioms = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
windows = "=0.62.2"
# Transport stack (ADR-002): exact pins; upgrades are deliberate patches with
# the M2 rig re-run. `rtc` is a direct dep because RTP/H264/Marshal types are
# not re-exported by `webrtc`.
webrtc = "=0.21.0"
rtc = "=0.21.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync"] }
bytes = "=1.12.1"
async-trait = "=0.1.92"
openh264 = "=0.9.8"
# M3 remote signaling client (`node-runtime::signaling_remote`): WebSocket
# primary + HTTP polling fallback against the Vercel service. native-tls =
# schannel on Windows (no extra build tooling), matching the workspace's
# exact-pin policy for the transport-adjacent tree.
tungstenite = { version = "=0.26.2", features = ["native-tls"] }
native-tls = "=0.2.14"
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls", "gzip", "json"] }
# Device-token entropy for the signaling client (safe API; keeps the
# node-runtime free of new `unsafe` beyond the AGENTS.md sanctioned list).
getrandom = "=0.3.3"

# Every crate in this workspace:
#   [package] version/edition/rust-version from workspace.package,
#   lints.workspace = true,
#   dependencies only via `workspace = true`.
