[package]
name = "remote-desktop-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "P2P Remote Desktop product shell (M4, RD-011/RD-012)"
default-run = "remote-desktop-app"

[lints]
workspace = true

[lib]
name = "remote_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The engine modules under src/engine/ are deliberately tauri-free: they are
# reused by the E2E child binary and the in-crate tests, which drive the
# exact code path the typed Tauri commands call (command-layer drive).
[[bin]]
name = "remote-desktop-app"
path = "src/main.rs"

[[bin]]
name = "e2e-child"
path = "src/bin/e2e_child.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shell (tauri tree; pinned here per the M4 work package — root
# [workspace.dependencies] stays untouched for the integrator to consolidate).
tauri = { version = "2", features = ["tray-icon"] }
# ADR-006 always-ready: login autostart + single instance (tray is core).
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# The engine (source of truth; the shell is a thin veneer over it).
node-runtime = { path = "../../../crates/node-runtime" }
protocol = { path = "../../../crates/protocol" }
diagnostics = { path = "../../../crates/diagnostics" }
session = { path = "../../../crates/session" }
transport-webrtc = { path = "../../../crates/transport-webrtc" }
capture-windows = { path = "../../../crates/capture-windows" }
codec-windows = { path = "../../../crates/codec-windows" }
render-windows = { path = "../../../crates/render-windows" }
input-windows = { path = "../../../crates/input-windows" }
frame-surface = { path = "../../../crates/frame-surface" }
# ADR-013 swarm enrollment: the Ed25519 installation identity + the MSP1
# signed-envelope/timestamp helpers (wire-mirrors the tracker).
modelswarm-identity = { path = "../../../crates/modelswarm-identity" }
# ADR-013 D4/P3 human chat: the pinned OnlyHumans protocol (v1.2.0) — the
# word-room net node (net::spawn) the human-chat background service drives.
# Humans-only surface; no agent tool reads or posts into rooms (slice 7
# enforces that structurally).
onlyhumans_core = { path = "../../../crates/onlyhumans-core" }
# ADR-013 P4 swarm inference: the MSP composition crate (engine sidecar
# supervisor, gateway wiring, libp2p serving/requester, catalog, artifacts).
# The real QUIC transport is behind the OFF-by-default `libp2p-backend`
# feature; the hosting service (P4 S3) composes these modules directly with
# the app's single SwarmIdentity rather than node's Node::start (which mints
# its own identity — incompatible with D3). S1 only links it; S3 wires it.
modelswarm-node = { path = "../../../crates/modelswarm-node", features = ["libp2p-backend"] }

serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # Account session tokens in the Windows Credential Manager (credstore.rs)
    "Win32_Security_Credentials",
    # ADR-011 elevation: token check + ShellExecuteW runas (elevate.rs)
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # ADR-012 release A: installed-app inventory reads the Uninstall hives
    # (agent/apps.rs).
    "Win32_System_Registry",
    # ADR-012 release B: scheduler local-time reads (agent/schedule.rs).
    "Win32_System_SystemInformation",
] }
# CSPRNG for device ids and the one-time session secret (same source the
# signaling client uses for tokens).
getrandom = { workspace = true }
# Zeroized DEK buffers for the in-memory account session (same crate the
# crypto layer uses; key bytes are never serialized).
# AI-agent MCP bridge (ADR-004, RD-018): stdio MCP server exposing the
# engine as screenshot/click/type tools to a local agent. Official Tier-1
# Rust SDK; runs on its own tokio current-thread runtime inside the app.
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { workspace = true }
# Base64 for MCP image content (screenshot JPEGs).
base64 = { workspace = true }
# Assistant provider client (ADR-005): OpenAI-compatible chat completions.
ureq = { workspace = true }
# Machine-chat sealing (ADR-005, RD-022): AES-256-GCM under pairing keys.
aes-gcm = { workspace = true }
# ADR-008 updater: SHA-256 verification of the staged installer against
# the published manifest.
sha2 = { workspace = true }
# ADR-013 swarm enrollment: the enrollment agent (swarm.rs) pins
# redirects(0) on the SAME schannel connector node-runtime's https_agent
# uses — the helper cannot express a redirect policy, and the MSP1
# Authorization header must never be re-sent cross-host by a 3xx.
native-tls = { workspace = true }

