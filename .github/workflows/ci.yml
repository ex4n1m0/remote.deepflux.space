name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node + pnpm (signaling service gate)
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Signaling service TS gate + headless contract matrix
        run: |
          pnpm --dir services/signaling install --frozen-lockfile
          pnpm --dir services/signaling test
          pnpm --dir services/signaling run test:contract:headless
