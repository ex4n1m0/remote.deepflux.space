[package]
name = "modelswarm-session"
description = "Cooperative session state machine: rounds, commits, rollback, peer replacement"
version = "0.2.42"
edition = "2021"
license = "Proprietary"
repository = "modelswarm"
rust-version = "1.85"

[dependencies]
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time"] }
modelswarm-gateway = { path = "../modelswarm-gateway" }
modelswarm-identity = { path = "../modelswarm-identity" }
modelswarm-runtime = { path = "../modelswarm-runtime" }
modelswarm-speculation = { path = "../modelswarm-speculation" }
modelswarm-transport = { path = "../modelswarm-transport" }
modelswarm-types = { path = "../modelswarm-types" }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["full"] }
modelswarm-runtime = { path = "../modelswarm-runtime", features = ["mock-runtime"] }
modelswarm-telemetry = { path = "../modelswarm-telemetry" }

# MSP v0.2.42 workspace lints, inlined per crate at the ADR-013 import so
# Remote's warn-level [workspace.lints] posture is left untouched.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
