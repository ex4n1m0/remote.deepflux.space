[package]
name = "modelswarm-speculation"
description = "Exact proposer/verifier speculative decoding and candidate-tree algorithms"
version = "0.2.42"
edition = "2021"
license = "Proprietary"
repository = "modelswarm"
rust-version = "1.85"



# MSP v0.2.42 workspace lints, inlined per crate at the ADR-013 import so
# Remote's warn-level [workspace.lints] posture is left untouched.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
