[package]
name = "modelswarm-identity"
description = "Ed25519 identity, signatures, nonces, capability-token verification"
version = "0.2.42"
edition = "2021"
license = "Proprietary"
repository = "modelswarm"
rust-version = "1.85"

[dependencies]
modelswarm-types = { path = "../modelswarm-types" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# MSP v0.2.42 workspace lints, inlined per crate at the ADR-013 import so
# Remote's warn-level [workspace.lints] posture is left untouched.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
