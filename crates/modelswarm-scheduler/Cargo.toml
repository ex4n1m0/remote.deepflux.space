[package]
name = "modelswarm-scheduler"
description = "Candidate filtering and predicted-completion-time peer selection"
version = "0.2.42"
edition = "2021"
license = "Proprietary"
repository = "modelswarm"
rust-version = "1.85"

[dependencies]
modelswarm-types = { path = "../modelswarm-types" }
# F15 observation types (pure data; no libp2p features needed) — the
# shadow-planner mapping consumes PeerObservations. Transport does not
# depend on the scheduler, so this edge is acyclic.
modelswarm-transport = { path = "../modelswarm-transport" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

# MSP v0.2.42 workspace lints, inlined per crate at the ADR-013 import so
# Remote's warn-level [workspace.lints] posture is left untouched.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
