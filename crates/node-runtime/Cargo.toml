[package]
name = "node-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Contract + state machines (ADR-001 leaves; the runtime composes them).
protocol = { path = "../protocol" }
session = { path = "../session" }
diagnostics = { path = "../diagnostics" }

# Platform boundaries (invariant 7) — composed here, never interdependent.
frame-surface = { path = "../frame-surface" }
capture-windows = { path = "../capture-windows" }
codec-windows = { path = "../codec-windows" }
render-windows = { path = "../render-windows" }
input-windows = { path = "../input-windows" }
transport-webrtc = { path = "../transport-webrtc" }

serde = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# M3 remote signaling client (WS primary + HTTP fallback).
tungstenite = { workspace = true }
native-tls = { workspace = true }
ureq = { workspace = true }
getrandom = { workspace = true }
