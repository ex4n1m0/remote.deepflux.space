[package]
name = "frame-surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Leaf crate (ADR-001 dependency rule): depends on nothing internal and
# nothing but the windows/D3D bindings. Platform crates (capture/codec/render)
# share GPU textures through this type instead of depending on each other.
[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_StationsAndDesktops",
    "Win32_Security",
] }
